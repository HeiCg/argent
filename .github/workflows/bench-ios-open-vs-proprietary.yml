# iOS-2 like-for-like bench — OFF (closed simulator-server + ax-service) vs
# ON-xcuitest (open XCUITest runner, input via XCUITest) vs ON-siminput (same
# XCUITest tree, input via the sim-input HID digitizer), on a hosted macOS runner.
#
# COST: macOS runners bill at 10x Linux minutes. `timeout-minutes: 180` (4 blocks with the open runner and sim-input take ~2 h). Manual
# trigger only. The closed binaries (simulator-server + ax-service) are fetched at
# RUN TIME (their LICENSE forbids redistribution) and never committed — the same
# recipe e2e-device-smoke.yml already uses on macos-latest.
#
# Only OFF vs ON WITHIN a single run is like-for-like. Every arm drives describe /
# gesture-tap / gesture-swipe through the tool-server registry; a report-only phase
# (G2).
#
# ONE XCUITest runner per simulator (2026-10-04 repair, run 37213144359): the job
# starts no resident runner. Each block's tool layer starts its own (cached build +
# `test-without-building`), the oracle reads through that same runner, and the
# block's dispose shuts it down. The step checks between blocks that no runner
# process survived, so two instances of the same xctrunner never share the
# simulator (they killed each other in run 37213144359).
name: bench-ios-open-vs-proprietary

on:
  workflow_dispatch:
    inputs:
      blocks:
        description: "Blocks to run (comma list)"
        required: false
        default: "OFF-1,ON-xcuitest,ON-siminput,OFF-2"
      n:
        description: "Iterations per verb (BENCH_N)"
        required: false
        default: "20"
      simulator_server_tag:
        description: "simulator-server release tag for the OFF arm (empty = the download script's default tag)"
        required: false
        default: ""
      slim:
        description: "Slim the simulator with simslim (.github/simslim/ci.json) before the blocks"
        type: boolean
        required: false
        default: false
  # (The temporary branch-scoped `push` trigger used during bring-up has been
  # REMOVED in this final commit, per the ticket. To dispatch again, place the
  # workflow on the default branch — workflow_dispatch cannot fire from a feature
  # branch.)

permissions:
  contents: read

jobs:
  ios-bench:
    runs-on: macos-latest
    # 90 → 120: run 37213144359 took 79 min with every block failing fast; each
    # block now also starts the tool-layer runner and waits for a stable frame
    # before every swipe.
    timeout-minutes: 180
    env:
      BENCH_N: ${{ github.event.inputs.n || '20' }}
      BENCH_BLOCKS: ${{ github.event.inputs.blocks || 'OFF-1,ON-xcuitest,ON-siminput,OFF-2' }}
      # simslim: false unless a dispatch asked for it (any other event reads false).
      SIM_SLIM: ${{ inputs.slim && 'true' || 'false' }}
      # The tool layer's runner build cache (keyed below it by Xcode version +
      # sources + destination): the warm step builds it, every block reuses it.
      ARGENT_IOS_RUNNER_DERIVED: ${{ github.workspace }}/build/ios-open-derived
      # Run 37223296646: the runner answered its first ping 91-98 s after launch and
      # missed the tool layer's 120 s budget on three of four block starts (each
      # block then started a second runner and was INVALID). 300 s on this host.
      ARGENT_IOS_RUNNER_READY_TIMEOUT_MS: "300000"
      # Each runner launch's xcodebuild output (discarded by default), so a slow or
      # failed start has a log in the artifact.
      ARGENT_IOS_RUNNER_LOG_DIR: ${{ github.workspace }}/build/runner-logs
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Pin Xcode and print the version (part of the build cache key)
        shell: bash
        run: |
          ls /Applications | grep -i '^Xcode' || true
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::no Xcode found under /Applications"; exit 1; fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install deps
        shell: bash
        run: |
          # npm install (not ci): this branch adds new workspaces; the committed
          # lockfile is not yet in sync (regenerated in the main checkout before merge).
          npm install --no-audit --no-fund
          npm install @rollup/rollup-darwin-arm64 --no-save

      - name: Build the workspace TypeScript
        shell: bash
        run: npm run build

      - name: Download the closed simulator-server + ax-service (OFF arm; run-time only)
        # Reuses the e2e-device-smoke.yml recipe. Their LICENSE forbids
        # redistribution, so fetch at run time, never commit.
        # Re-baseline (0.27): `simulator_server_tag` picks the release; empty keeps
        # the script's own default (no argument passed — today's behaviour). The
        # requested tag, the release it resolved to (gh release view: tag, name,
        # publishedAt, asset id + digest) and the sha256 of the downloaded binary
        # are recorded in .bench-results/proprietary-provenance.json, which the
        # merge folds into the merged JSON and the scoreboard renders.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIM_SERVER_TAG: ${{ github.event.inputs.simulator_server_tag }}
        run: |
          if [ -n "$SIM_SERVER_TAG" ]; then
            if ! [[ "$SIM_SERVER_TAG" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::simulator_server_tag '$SIM_SERVER_TAG' has characters outside [A-Za-z0-9._/-]"; exit 1
            fi
            bash scripts/download-simulator-server.sh "$SIM_SERVER_TAG" || echo "::warning::simulator-server download failed — OFF arm may be unavailable"
          else
            bash scripts/download-simulator-server.sh || echo "::warning::simulator-server download failed — OFF arm may be unavailable"
          fi
          bash scripts/download-native-binaries.sh || echo "::warning::native binaries (ax-service) download failed — OFF arm may be unavailable"
          echo "=== native-devtools-ios inventory ==="
          ls -la packages/native-devtools-ios/bin/darwin 2>/dev/null || true
          ls -la packages/native-devtools-ios/dylibs 2>/dev/null || true
          # Provenance (record-only; never fails the step). The script's default tag
          # and repo are read from the script itself so the record follows it.
          SCRIPT=scripts/download-simulator-server.sh
          SCRIPT_DEFAULT_TAG=$(sed -n 's/^TAG="\${1:-\([^}]*\)}"$/\1/p' "$SCRIPT")
          SIM_REPO=$(sed -n 's/^REPO="\([^"]*\)"$/\1/p' "$SCRIPT")
          RESOLVED_TAG="${SIM_SERVER_TAG:-$SCRIPT_DEFAULT_TAG}"
          gh release view "$RESOLVED_TAG" --repo "$SIM_REPO" \
            --json tagName,name,publishedAt,createdAt,url,assets > "$RUNNER_TEMP/sim-server-release.json" \
            || { echo "::warning::gh release view $RESOLVED_TAG failed — release identity unresolved"; echo '{}' > "$RUNNER_TEMP/sim-server-release.json"; }
          mkdir -p .bench-results
          node .github/bench-ci/proprietary-provenance.js gh-release \
            --repo "$SIM_REPO" \
            --requested-tag "$SIM_SERVER_TAG" \
            --script-default-tag "$SCRIPT_DEFAULT_TAG" \
            --resolved-tag "$RESOLVED_TAG" \
            --release-json "$RUNNER_TEMP/sim-server-release.json" \
            --asset simulator-server-argent-macos \
            --file packages/native-devtools-ios/bin/darwin/simulator-server \
            --file packages/native-devtools-ios/bin/darwin/ax-service \
            --out .bench-results/proprietary-provenance.json \
            || echo "::warning::provenance record failed — OFF arm release will read unknown"

      - name: Build sim-input (ON-siminput arm)
        shell: bash
        run: |
          set -o pipefail
          bash packages/ios-sim-input/scripts/build-sim-input.sh 2>&1 | tee build-sim-input.log
          ls -la packages/ios-sim-input/bin/
          echo "IOS_SIM_INPUT_BINARY=$PWD/packages/ios-sim-input/bin/sim-input" >> "$GITHUB_ENV"

      - name: Install simslim (both modes; slim=false only measures, never slims)
        # Pinned v0.11.0 + sha256 in the script. Stock runs install it too, so the
        # bench records a `simslim measure` baseline on the same runner image.
        shell: bash
        run: |
          if ! bash .github/bench-ci/install-simslim.sh; then
            if [ "$SIM_SLIM" = "true" ]; then echo "::error::simslim install failed"; exit 1; fi
            echo "::warning::simslim install failed — stock run without a simulator measure"
          fi

      - name: Create and boot an iPhone simulator
        shell: bash
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j \
            | jq -r '[.runtimes[] | select(.platform=="iOS" and .isAvailable)]
                     | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
          echo "runtime=$RUNTIME"
          CANDIDATES=$(xcrun simctl list devicetypes -j \
            | jq -r '[.devicetypes[] | select(.name | test("^iPhone [0-9]+"))]
                     | map(. + {n: (.name | capture("iPhone (?<x>[0-9]+)").x | tonumber)})
                     | sort_by(.n) | reverse | .[].identifier')
          UDID=""
          for DT in $CANDIDATES; do
            if UDID=$(xcrun simctl create "argent-ios-bench" "$DT" "$RUNTIME" 2>/dev/null); then
              echo "created simulator with $DT"; break
            fi
            UDID=""
          done
          if [ -z "$UDID" ]; then echo "::error::no iPhone device type is compatible with $RUNTIME"; exit 1; fi
          # slim=true: `simslim on` + bootstatus + verify (drift fails the job);
          # slim=false: the plain `simctl boot` + bootstatus.
          bash .github/bench-ci/simslim-ci.sh boot "$UDID"
          # The simulator record after boot (status + measure; record-only). This
          # is the ONLY boot: every block below runs on it, so all blocks share
          # the slim state; each block is stamped with it again and the merge
          # refuses blocks whose slim state differs.
          mkdir -p .bench-results/simslim
          bash .github/bench-ci/simslim-ci.sh snapshot "$UDID" .bench-results/simslim boot
          node .github/bench-ci/proprietary-provenance.js simulator --slim "$SIM_SLIM" \
            --simslim-version "$(cat .bench-results/simslim/simslim-version.txt 2>/dev/null)" \
            --profile .github/simslim/ci.json \
            --status-json .bench-results/simslim/simslim-status-boot.json \
            --measure-json .bench-results/simslim/simslim-measure-boot.json \
            --out .bench-results/simulator.json \
            || echo "::warning::simulator record failed"
          # Launch Settings once so the first block starts from a warm root.
          xcrun simctl launch "$UDID" com.apple.Preferences || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Warm the tool-layer runner (build-for-testing, one launch, one tree read, shut down)
        # The same code path every block uses (registry → ios-open-server blueprint),
        # so a runner that cannot build or start fails here in minutes and the
        # blocks find the build cache warm. The tool layer discards xcodebuild's
        # output, so on failure the build is re-run once for its log.
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          if ! BENCH_WARM_RUNNER=1 BENCH_UDID="$SIM_UDID" node .github/bench-ci/run-bench-ios.js 2>&1 | tee build/warm-runner.log; then
            echo "::error::the tool layer's XCUITest runner did not build or start; re-running build-for-testing for its log"
            xcodebuild build-for-testing \
              -project packages/ios-device-server/ArgentRunner/ArgentRunner.xcodeproj \
              -scheme ArgentRunner \
              -destination "platform=iOS Simulator,id=$SIM_UDID" \
              -derivedDataPath build/ios-open-diag \
              ONLY_ACTIVE_ARCH=YES ENABLE_CODE_COVERAGE=NO \
              2>&1 | tee build/build-sim.log || true
            exit 1
          fi

      - name: Run the four bench blocks + merge + scoreboard (one tool-layer runner per block)
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=3072"
        run: |
          set -uo pipefail
          export BENCH_OUT="$PWD/.bench-results"
          mkdir -p "$BENCH_OUT" build/shots
          export TMPDIR="$PWD/build/shots"
          export BENCH_UDID=$SIM_UDID

          # One XCUITest runner per simulator: no runner process may survive the
          # warm step or a block's dispose. Wait up to 30 s, then kill and warn.
          runner_procs () {
            pgrep -fl "xcodebuild test-without-building" || true
            pgrep -fl "ArgentRunnerUITests-Runner" || true
          }
          assert_no_runner () {
            local when="$1"
            for _ in $(seq 1 30); do
              if [ -z "$(runner_procs)" ]; then echo "$when: no runner process" >> build/runner-processes.log; return 0; fi
              sleep 1
            done
            { echo "$when: runner process still alive after 30 s:"; runner_procs; } | tee -a build/runner-processes.log
            echo "::warning::$when: an XCUITest runner outlived its owner; killing it so the next block starts the only one"
            pkill -f "xcodebuild test-without-building" || true
            pkill -f "ArgentRunnerUITests-Runner" || true
            sleep 2
          }

          run_block () {
            local b="$1"
            echo "########## BLOCK $b ##########"
            BENCH_ONLY="$b" BENCH_N="$BENCH_N" node .github/bench-ci/run-bench-ios.js \
              2>&1 | tee -a "$BENCH_OUT/bench-log-$b.txt"
            return "${PIPESTATUS[0]}"
          }

          # Stamp the block with the simulator record (simslim status + measure,
          # never `on`), so the merge can refuse mixed slim state.
          record_block () {
            local b="$1"
            bash .github/bench-ci/simslim-ci.sh snapshot "$SIM_UDID" "$BENCH_OUT/simslim" "$b"
            [ -f "$BENCH_OUT/bench-block-$b.json" ] || return 0
            node .github/bench-ci/proprietary-provenance.js simulator --slim "$SIM_SLIM" \
              --simslim-version "$(cat "$BENCH_OUT/simslim/simslim-version.txt" 2>/dev/null)" \
              --profile .github/simslim/ci.json \
              --status-json "$BENCH_OUT/simslim/simslim-status-$b.json" \
              --measure-json "$BENCH_OUT/simslim/simslim-measure-$b.json" \
              --block "$BENCH_OUT/bench-block-$b.json" \
              || echo "::warning::simulator record failed for $b"
          }

          set +e
          STATUS=0
          IFS=',' read -ra BLKS <<< "$BENCH_BLOCKS"
          for b in "${BLKS[@]}"; do
            assert_no_runner "before $b"
            run_block "$b" || { echo "::warning::block $b exited non-zero"; STATUS=1; }
            record_block "$b"
          done
          assert_no_runner "after the blocks"
          echo "########## MERGE ##########"
          node .github/bench-ci/merge-blocks-ios.js 2>&1 | tee "$BENCH_OUT/merge.log"
          MERGE_RC=${PIPESTATUS[0]}
          set -e

          # The merge enforces the FATAL gates (G0/G1/G3 + validity) — its non-zero exit fails
          # the run. A non-zero block exit that the merge did not already catch also
          # fails the run.
          if [ "$MERGE_RC" != "0" ]; then exit "$MERGE_RC"; fi
          exit "$STATUS"

      - name: Scoreboard → job summary
        if: always()
        shell: bash
        run: |
          export BENCH_OUT="$PWD/.bench-results"
          if node .github/bench-ci/scoreboard-ios.js > "$BENCH_OUT/scoreboard-ios.md" 2>/tmp/sb.err; then
            cat "$BENCH_OUT/scoreboard-ios.md" >> "$GITHUB_STEP_SUMMARY"
            cat "$BENCH_OUT/scoreboard-ios.md"
          else
            echo "iOS scoreboard generation failed" | tee -a "$GITHUB_STEP_SUMMARY"
            cat /tmp/sb.err || true
          fi

      - name: Stamp artifacts with the run id
        if: always()
        shell: bash
        run: |
          export BENCH_OUT="$PWD/.bench-results"
          mkdir -p "$BENCH_OUT"
          echo "run_id=${{ github.run_id }} attempt=${{ github.run_attempt }} sha=${{ github.sha }}" > "$BENCH_OUT/RUN_ID.txt"
          # Stamp each results file with the run id (G5: every artifact file stamped).
          for f in "$BENCH_OUT"/*.json "$BENCH_OUT"/*.md "$BENCH_OUT"/*.txt; do
            [ -f "$f" ] || continue
            case "$f" in
              *.json) ;; # JSON already carries env.runId
              *) sed -i '' "1s;^;<!-- run_id=${{ github.run_id }} -->\n;" "$f" 2>/dev/null || true ;;
            esac
          done

      # Upload BEFORE teardown: run 3 hung in the Stop step and its if:always upload
      # never ran, losing every result. The bench cleans up its screenshots as it
      # goes (rmShot), so build/shots is NOT uploaded — only the JSON/logs/scoreboard
      # that carry the numbers, which uploads fast. build-sim.log exists only when
      # the warm step failed (the diagnostic re-build).
      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ios-open-vs-proprietary
          path: |
            .bench-results
            build/build-sim.log
            build/warm-runner.log
            build/runner-processes.log
            build/runner-logs
            build-sim-input.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Stop the runner and simulator
        if: always()
        shell: bash
        run: |
          # Guard every teardown command with a timeout: run 3 HUNG here on a bare
          # `xcrun simctl shutdown` (the XCUITest runner still held the sim). The
          # artifact is already uploaded above, so a slow teardown can no longer lose
          # the results.
          pkill -f "xcodebuild test-without-building" 2>/dev/null || true
          timeout 45 xcrun simctl shutdown "$SIM_UDID" 2>/dev/null || echo "simctl shutdown timed out — continuing"
          timeout 45 xcrun simctl shutdown all 2>/dev/null || true
