name: Unit Tests

on:
  push:
    branches:
      - main
      - open/main
  pull_request:
    branches:
      - main
      - open/main

# Supersede a PR's in-flight run rather than let it hold a runner for a verdict
# nobody wants. A push to main keeps its run: that is the commit's only record.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Fix rollup native bindings
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Build workspace dependencies
        run: npm run build

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Test root scripts
        run: npm run test:scripts

      - name: Test bench CI gates
        # Unit tests for the bench merge/scoreboard gates (review: "gates never
        # observed to fire"). Pure Node, no build/emulator — proves each gate
        # fires/does-not-fire against synthetic block/fling JSONs.
        run: node --test .github/bench-ci/gates.test.js

      - name: Test iOS bench CI gates
        # iOS-2.1 (IOS2-M4/M9/H3): per-verb errors, short latency runs (n < N),
        # runner crashes and tap-coordinate drift each fire / do-not-fire against
        # synthetic iOS block JSONs.
        run: node --test .github/bench-ci/gates-ios.test.js

      - name: Test bench emulator diagnostics
        # Sampler line/heartbeat formatters, the liveness watchdog's 3-strikes logic
        # and kill-target selection, the ci-emulator-env.json builder — injected
        # command runners, no adb or emulator.
        run: node --test .github/bench-ci/emulator-diagnostics.test.js

      - name: Test bench Settings reset wait
        # Run 37561512651: the latency bench waits after every Settings am start until
        # Settings is resumed, focused, not finishing and on a stable pid (relaunched if
        # the delayed post-pm-clear kill took it). Injected probe/clock, no adb.
        run: node --test .github/bench-ci/settings-reset.test.js

  # Typechecking needs the same install and build as the tests but none of their
  # output, so running it alongside them takes its ~60s off the critical path
  # rather than adding to it.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:tests --workspaces --if-present

      - name: Typecheck scripts
        run: npm run typecheck:scripts
