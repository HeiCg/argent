name: bench-open-vs-proprietary

# Runs the "open Kotlin android-device-server vs proprietary simulator-server"
# Android backend benches off-host, on a GitHub-hosted ubuntu-latest runner with
# nested-virt KVM. The local dev box (24 GB RAM, exhausted) can no longer boot an
# emulator, so the KVM + SDK + AVD boot steps here are lifted from wayland-e2e.yml
# and its composite actions. The emulator is booted DIRECTLY (not via the
# tool-server) so the proprietary `android` controller can discover it over gRPC
# with a token — `-grpc 8554 -grpc-use-token`, exactly what
# bench-open-vs-proprietary.ts documents it needs.
#
# x86_64 / KVM here is NOT comparable to the local arm64 / HVF numbers; only OFF
# vs ON within a single run is like-for-like. The proprietary simulator-server
# ships bin/linux/ (x86_64); if it refuses to run on the hosted runner the OFF
# arm is skipped and the run is scored ON-only (acceptance allows this).
#
# Emulator diagnostics (2026-10-04, docs/open-server/2026-10-04-bench-emulator-loss.md):
# .github/bench-ci/emulator-diagnostics.sh records the emulator/host environment
# (ci-emulator-env.json), samples the host every 30 s during the bench step, runs a
# liveness watchdog that terminates the bench when the emulator is lost (never
# restarts it), and collects a post-mortem. emulator_build / emulator_gpu /
# emulator_memory_mb are the levers to test an emulator-version regression; their
# defaults keep today's behaviour.

on:
  workflow_dispatch:
    inputs:
      blocks:
        description: "Latency blocks to run (comma list)"
        required: false
        default: "OFF-1,ON-uiautomation,ON-input-manager,OFF-legacy,OFF-2"
      proprietary_version:
        description: "@swmansion/argent release whose binaries the proprietary (OFF) blocks use"
        required: false
        default: "0.27.0"
      legacy_proprietary_version:
        description: "Older @swmansion/argent release for the OFF-legacy block (empty = skip OFF-legacy)"
        required: false
        default: "0.22.1"
      n:
        description: "Iterations per verb (BENCH_N)"
        required: false
        default: "20"
      suite:
        description: "Which suite(s) to run"
        required: false
        default: "latency"
        type: choice
        options:
          - latency
          - screen-graph
          - both
      sg_mode:
        description: "screen-graph mode: capture (pre-flight dumps launch+destination to capture.json, no matrix) or matrix"
        required: false
        default: "matrix"
        type: choice
        options:
          - matrix
          - capture
      emulator_build:
        description: 'Pin an emulator build id (e.g. 13610412 = 35.6.11) from dl.google.com; empty = sdkmanager "emulator" (today)'
        required: false
        default: ""
      emulator_gpu:
        description: "Emulator -gpu mode"
        required: false
        default: "swiftshader_indirect"
      emulator_memory_mb:
        description: "AVD hw.ramSize (MB)"
        required: false
        default: "4096"

jobs:
  # ── Latency bench (4 blocks) + device smoke ───────────────────────────────
  latency:
    name: Latency bench (OFF/ON, x86_64 KVM)
    if: ${{ github.event.inputs.suite == 'latency' || github.event.inputs.suite == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Pin AVDs to the legacy ~/.android location (see wayland-e2e.yml for the
      # ANDROID_USER_HOME rationale — newer cmdline-tools default it to
      # $XDG_CONFIG_HOME/.android and diverge from the sed/grep paths below).
      ANDROID_USER_HOME: /home/runner/.android
      # Emulator's bundled Qt has no wayland plugin and no display here; offscreen
      # keeps Qt happy for a `-no-window` boot without a real display server.
      QT_QPA_PLATFORM: offscreen
      # gRPC discovery: the emulator registers its running gRPC endpoint under a
      # temp dir; force a stable XDG_RUNTIME_DIR so the proprietary android
      # controller and the emulator agree on where the discovery ini lives.
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      BENCH_N: ${{ github.event.inputs.n }}
      BENCH_BLOCKS: ${{ github.event.inputs.blocks }}
      # Re-baseline (0.27): the proprietary release(s) the OFF arms run. Read by the
      # fetch step, the provenance stamp and the merge (which refuses a block stamped
      # with another release).
      BENCH_PROPRIETARY_VERSION: ${{ github.event.inputs.proprietary_version || '0.27.0' }}
      BENCH_LEGACY_PROPRIETARY_VERSION: ${{ github.event.inputs.legacy_proprietary_version }}
      # Emulator diagnostics + levers (emulator-diagnostics.sh). Defaults = today.
      EMU_DIAG_DIR: /tmp/emu-diag
      EMULATOR_BUILD: ${{ github.event.inputs.emulator_build }}
      EMULATOR_GPU: ${{ github.event.inputs.emulator_gpu || 'swiftshader_indirect' }}
      EMULATOR_MEMORY_MB: ${{ github.event.inputs.emulator_memory_mb || '4096' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ---- KVM + SDK + AVD: lifted verbatim from wayland-e2e.yml ----
      - name: Enable KVM (nested virt on ubuntu-latest)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install emulator native deps
        # libgoogle-perftools4t64 ships libtcmalloc_minimal.so.4 which
        # qemu-system-x86_64 links against (verbatim from wayland-e2e.yml).
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            weston xkb-data libxkbcommon0 seatd libgoogle-perftools4t64

      - name: Install Android SDK packages
        run: |
          set -e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "emulator" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "system-images;android-34;google_apis;x86_64" >/dev/null
          SYSIMG="$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
          test -f "$SYSIMG/system.img" || test -f "$SYSIMG/userdata.img" || {
            echo "::error::system image not installed under $SYSIMG"
            ls -la "$ANDROID_HOME/system-images/android-34" 2>&1 || true
            exit 1
          }
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Pin emulator build (optional) + record emulator environment
        # emulator_build empty = keep sdkmanager's "emulator" (no change). Set = install
        # that exact build from dl.google.com, fail early on a 404, write back the stock
        # package.xml at the zip's Pkg.Revision (else avdmanager refuses the AVD),
        # verify -version and `sdkmanager --list_installed`.
        # Then ci-emulator-env.json (emulator version/build, system-image revision, adb,
        # $ImageVersion, kernel, nproc, free -m): uploaded and embedded in the results.
        run: |
          set -e
          [[ "$EMULATOR_MEMORY_MB" =~ ^[0-9]+$ ]] || { echo "::error::emulator_memory_mb '$EMULATOR_MEMORY_MB' is not a number"; exit 1; }
          [[ "$EMULATOR_GPU" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::emulator_gpu '$EMULATOR_GPU' is not a -gpu mode"; exit 1; }
          bash .github/bench-ci/emulator-diagnostics.sh install-emulator "$EMULATOR_BUILD"
          bash .github/bench-ci/emulator-diagnostics.sh env "system-images;android-34;google_apis;x86_64" "$GITHUB_WORKSPACE/.bench-results/ci-emulator-env.json"

      - name: Create AVD (emulator_memory_mb, default 4 GB / 2 vCPUs)
        run: |
          set -e
          mkdir -p "$HOME/.android"
          echo no | avdmanager -v create avd \
            -n argent-test \
            -k "system-images;android-34;google_apis;x86_64" \
            -d "pixel_6" 2>&1 | tee /tmp/avdmanager.log
          AVD_RC=${PIPESTATUS[1]}
          CFG=$HOME/.android/avd/argent-test.avd/config.ini
          if [ "$AVD_RC" -ne 0 ] || [ ! -f "$CFG" ]; then
            echo "::error::avdmanager exit=$AVD_RC, config.ini=$([ -f "$CFG" ] && echo present || echo missing)"
            cat /tmp/avdmanager.log
            exit 1
          fi
          sed -i "s/^hw.ramSize.*\$/hw.ramSize = $EMULATOR_MEMORY_MB/" "$CFG" || echo "hw.ramSize = $EMULATOR_MEMORY_MB" >> "$CFG"
          sed -i 's/^hw.cpu.ncore.*$/hw.cpu.ncore = 2/' "$CFG" || echo "hw.cpu.ncore = 2" >> "$CFG"
          grep -E "^(hw\.ramSize|hw\.cpu\.ncore|hw\.gpu)" "$CFG"

      - name: Boot emulator with gRPC + token
        # Direct boot (not the tool-server) so the proprietary android controller
        # can discover the emulator via the grpc.port/grpc.token it needs. Headless
        # + swiftshader like wayland-e2e, but with `-grpc 8554 -grpc-use-token`.
        run: |
          set -e
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          nohup $ANDROID_HOME/emulator/emulator @argent-test \
            -no-window -no-audio -no-boot-anim -no-snapshot -read-only \
            -gpu "$EMULATOR_GPU" -grpc 8554 -grpc-use-token \
            -no-metrics -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          echo "emulator pid=$!"
          adb start-server
          # Wait for the device node.
          timeout 300 adb wait-for-device
          # Wait for full boot.
          for i in $(seq 1 180); do
            BC=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')
            if [ "$BC" = "1" ]; then echo "boot_completed at t+${i}s"; break; fi
            sleep 2
          done
          [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '[:space:]')" = "1" ] || {
            echo "::error::emulator did not finish booting"; tail -100 /tmp/emulator.log; exit 1; }
          # Settle + disable animations for stable, fast gestures.
          adb -s emulator-5554 shell input keyevent 82 || true
          adb -s emulator-5554 shell settings put global window_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0 || true
          # Extra settle: a cold, contended x86 boot let tests race a still-janky
          # launcher (Pixel Launcher ANR'd in a prior run, degrading the whole
          # session). Wake, dismiss keyguard, and wait for a resumed home activity
          # plus a grace period so the first tests hit a settled UI.
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP || true
          adb -s emulator-5554 shell wm dismiss-keyguard || true
          for i in $(seq 1 30); do
            RESUMED=$(adb -s emulator-5554 shell dumpsys activity activities 2>/dev/null \
              | grep -c "mResumedActivity" || true)
            [ "${RESUMED:-0}" -ge 1 ] && { echo "resumed activity present at settle t+$((i*2))s"; break; }
            sleep 2
          done
          sleep 25
          adb devices -l
          # Verify the gRPC discovery ini the proprietary android controller reads
          # (linux: $XDG_RUNTIME_DIR/avd/running/pid_*.ini, else /run/user/<uid>/…).
          # set -e safe: never let a missing dir / non-matching glob fail the step.
          echo "=== gRPC discovery ==="
          for d in "$XDG_RUNTIME_DIR/avd/running" "/run/user/$(id -u)/avd/running"; do
            [ -d "$d" ] || continue
            ls -la "$d" || true
            for f in "$d"/pid_*.ini; do
              [ -f "$f" ] || continue
              echo "--- $f ---"; grep -E '^(grpc\.port|port\.serial|grpc\.token)' "$f" || true
            done
          done
          # gRPC token often lands in a file rather than the ini; the proprietary
          # controller reads it as a fallback. Diagnostic only — never fatal.
          ls -la ~/.emulator_console_auth_token 2>&1 || echo "(no console auth token file)"
          echo "boot step complete"

      - name: Install argent deps + build TS
        # `npm ci` (phase 3n.3, 3N2-H2): the committed lockfile was regenerated in the
        # main checkout after the 3n.2 merge (the @yume-chan/* + fetch-scrcpy-server
        # subtree dropped), so it matches package.json again and the lockfile-integrity
        # check is back. Rollup's native binary is an optional dep npm can skip, so
        # install it explicitly.
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --no-save
          npm run build

      - name: Build open device-server APK (Kotlin, Java 17)
        # ON path installs packages/android-device-server/bin/argent-device-control-<ver>.apk
        # via adb; nothing builds it on the fly, so build it here (gradle assembleDebug).
        run: |
          npm run build:android-device-server
          ls -la packages/android-device-server/bin/

      - name: Fetch proprietary binaries (npm pack @swmansion/argent@<proprietary_version> [+ legacy])
        # OFF path. Their LICENSE forbids redistribution, not use — download at run
        # time, never commit. bin/linux/ is the x86_64 build for this runner.
        # Re-baseline (0.27): the current release (OFF-1/OFF-2) and, when
        # legacy_proprietary_version is set, an older release for OFF-legacy, each
        # extracted to its own dir. The version comes from the dispatch input; the
        # provenance stamp later re-reads it from each tarball's package.json.
        run: |
          set -e
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          fetch_pkg () {
            local ver="$1" label="$2"
            if ! [[ "$ver" =~ $SEMVER ]]; then
              echo "::error::${label} proprietary version '${ver}' is not a semver"; exit 1
            fi
            local PKGTMP="$RUNNER_TEMP/argent-pkg-$ver"
            mkdir -p "$PKGTMP"
            ( cd "$PKGTMP" && npm pack "@swmansion/argent@$ver" )
            local TARBALL
            TARBALL=$(ls "$PKGTMP"/*.tgz | head -n1)
            mkdir -p "$PKGTMP/extracted"
            tar -xzf "$TARBALL" -C "$PKGTMP/extracted"
            FETCHED_PKG="$PKGTMP/extracted/package"
            chmod +x "$FETCHED_PKG/bin/linux/simulator-server" 2>/dev/null || true
            echo "=== ${label} @swmansion/argent@$ver bin/linux ==="; ls -la "$FETCHED_PKG/bin/linux" || true
            echo "=== file(1) on the ${label} linux binary ==="; file "$FETCHED_PKG/bin/linux/simulator-server" || true
            sha256sum "$FETCHED_PKG/bin/linux/simulator-server" "$FETCHED_PKG"/bin/argent-android-devtools-*.apk || true
            # Best-effort probe: does the x86_64 binary even exec on this runner?
            if "$FETCHED_PKG/bin/linux/simulator-server" --version >"/tmp/prop-probe-$label.txt" 2>&1 \
               || "$FETCHED_PKG/bin/linux/simulator-server" --help >>"/tmp/prop-probe-$label.txt" 2>&1; then
              FETCHED_EXEC=1
              echo "${label} proprietary binary executes on this runner"
            else
              FETCHED_EXEC=0
              echo "::warning::${label} proprietary simulator-server did not exec cleanly — its OFF arm is best-effort"
            fi
            cat "/tmp/prop-probe-$label.txt" || true
          }
          fetch_pkg "$BENCH_PROPRIETARY_VERSION" current
          echo "PROP_PKG=$FETCHED_PKG" >> "$GITHUB_ENV"
          echo "PROP_EXECUTABLE=$FETCHED_EXEC" >> "$GITHUB_ENV"
          cp /tmp/prop-probe-current.txt /tmp/prop-probe.txt 2>/dev/null || true
          if [ -n "$BENCH_LEGACY_PROPRIETARY_VERSION" ]; then
            fetch_pkg "$BENCH_LEGACY_PROPRIETARY_VERSION" legacy
            echo "PROP_PKG_LEGACY=$FETCHED_PKG" >> "$GITHUB_ENV"
            echo "PROP_LEGACY_EXECUTABLE=$FETCHED_EXEC" >> "$GITHUB_ENV"
          else
            echo "legacy_proprietary_version empty — OFF-legacy will be skipped"
            echo "PROP_LEGACY_EXECUTABLE=0" >> "$GITHUB_ENV"
          fi

      - name: Record CI runner env facts
        run: |
          mkdir -p .bench-results
          NPROC=$(nproc)
          MEM_TOTAL=$(free -m | awk '/^Mem:/{print $2}')
          MEM_AVAIL=$(free -m | awk '/^Mem:/{print $7}')
          SWAP_TOTAL=$(free -m | awk '/^Swap:/{print $2}')
          KVM=$([ -e /dev/kvm ] && echo true || echo false)
          node -e "const fs=require('fs');fs.writeFileSync('.bench-results/ci-runner-env.json',JSON.stringify({runner:'ubuntu-latest',nproc:${NPROC},memTotalMb:${MEM_TOTAL},memAvailMb:${MEM_AVAIL},swapTotalMb:${SWAP_TOTAL},kvm:${KVM},emulatorImage:'system-images;android-34;google_apis;x86_64',emulatorArch:'x86_64',propExecutable:process.env.PROP_EXECUTABLE==='1',proprietaryVersion:process.env.BENCH_PROPRIETARY_VERSION,legacyProprietaryVersion:process.env.BENCH_LEGACY_PROPRIETARY_VERSION||null,propLegacyExecutable:process.env.PROP_LEGACY_EXECUTABLE==='1',note:'x86_64/KVM hosted runner — NOT comparable to local arm64/HVF'},null,2))"
          cat .bench-results/ci-runner-env.json

      # ---- (1) device test ----
      - name: Open-server on-device test (OPEN_SERVER_DEVICE_TESTS=1)
        id: devtest
        # Validation gate (phase 3h). Phase 3n.2 (review 3N1-M8): `continue-on-error`
        # is REMOVED so a device-test failure fails THIS step visibly (previously the
        # step reported success and a failure was only visible via the final Enforce
        # step). The latency bench + artifact steps below carry `if: ${{ !cancelled() }}`
        # / `if: always()`, so their diagnostics still run and upload after a
        # device-test failure, and the Enforce step re-confirms the failure at the end.
        env:
          OPEN_SERVER_DEVICE_TESTS: "1"
          OPEN_SERVER_DEVICE_SERIAL: emulator-5554
        run: |
          set -uo pipefail
          # Readiness gate: a tap that lands on an ANR dialog is not a landed tap.
          # Wait for a settled, launcher-focused emulator (no "Application Not
          # Responding" window) before running — logs the wait, never fatal.
          bash .github/bench-ci/ready-gate.sh emulator-5554 3 90 | tee "$RUNNER_TEMP/ready-gate-device-test.txt"
          # Capture logcat (verbose input) across the run so a dropped/mis-targeted
          # injected touch is diagnosable.
          adb -s emulator-5554 shell setprop log.tag.InputDispatcher VERBOSE || true
          adb -s emulator-5554 shell setprop log.tag.InputReader VERBOSE || true
          adb -s emulator-5554 logcat -c || true
          adb -s emulator-5554 logcat -v threadtime > "$RUNNER_TEMP/logcat-device-test.txt" 2>&1 &
          LOGCAT_PID=$!
          cd packages/tool-server
          # Run WITHOUT aborting on failure so logcat is always stopped and the exit
          # code is still propagated (pipefail via PIPESTATUS): a device-test failure
          # must fail the job (continue-on-error is gone), but the diagnostics must
          # survive it.
          set +e
          npx vitest run test/blueprints/android-open-server.device.test.ts 2>&1 \
            | tee "$RUNNER_TEMP/device-test.log"
          RC=${PIPESTATUS[0]}
          set -e
          kill "$LOGCAT_PID" 2>/dev/null || true
          echo "device-test vitest exit=$RC"
          exit "$RC"

      # ---- (2) latency bench: blocks via BENCH_ONLY, then merge ----
      - name: Latency bench — blocks + merge
        # Phase 3n.2 (3N1-M8): runs even after a device-test failure (which now fails
        # its own step) so the bench diagnostics survive and upload.
        if: ${{ !cancelled() }}
        env:
          ARGENT_SIMULATOR_SERVER_DIR: ${{ env.PROP_PKG }}/bin
          ARGENT_NATIVE_DEVTOOLS_ANDROID_BIN_DIR: ${{ env.PROP_PKG }}/bin
          ARGENT_NATIVE_DEVTOOLS_DIR: ${{ env.PROP_PKG }}/dylibs
          BENCH_SERIAL: emulator-5554
          # Phase 3j (3d shipped): the on-device server now decides the 0.0.0.0 bind
          # itself from the qemu system properties (EmulatorDetect), so redir engages
          # on this emulator with NO host env — this run validates that shipped path.
          # ARGENT_OPEN_SERVER_BIND_ALL stays available only as a loud CI/debug
          # override and is deliberately NOT set here.
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: |
          # pipefail so a block's `node … | tee` reports node's exit, not tee's —
          # an ON-block bench failure (e.g. a no-effect tap) must fail the step.
          set -eo pipefail
          export BENCH_OUT="$PWD/.bench-results"
          mkdir -p "$BENCH_OUT"
          # F7: capture logcat ACROSS the bench blocks (not only the device-test
          # step) so a first-attempt no-effect tap is diagnosable (ANR / crash /
          # activity context around the miss the bench code logs with fingerprints).
          # NB: do NOT enable InputDispatcher/InputReader VERBOSE here — verbose input
          # logging perturbs the ON path's synced UiAutomation inject and inflated the
          # ON gesture-tap/gesture-swipe latency ~10x in the first 3k run (OFF, which
          # injects via the emulator gRPC console, was unaffected), contaminating the
          # "unchanged verbs vs run 7" comparison. Plain threadtime only. The delivered
          # MotionEvent-duration measurement lives in the isolated device-test 3k step.
          adb -s emulator-5554 logcat -c || true
          adb -s emulator-5554 logcat -v threadtime > "$BENCH_OUT/logcat-bench.txt" 2>&1 &
          BENCH_LOGCAT_PID=$!
          stop_logcat () { kill "$BENCH_LOGCAT_PID" 2>/dev/null || true; }
          # Fail-closed on a lost emulator: the watchdog (emulator-diagnostics.sh)
          # SIGTERMs the running block when the qemu process dies, `adb get-state`
          # fails 3x (10 s apart) or the memory guard trips (host avail < 700 MB with
          # qemu RSS > 2.5x guest RAM, 2 checks), and writes the marker below. Remaining
          # blocks are skipped (never on a restarted emulator), the merge still runs over
          # the completed blocks (marked partial) and the step fails. The host sampler's
          # 60 s heartbeat lands in this step's log.
          export BENCH_EMULATOR_LOST_FILE="$EMU_DIAG_DIR/emulator-lost.json"
          export BENCH_CONTEXT_FILE="$EMU_DIAG_DIR/context"
          emu_lost () { [ -f "$BENCH_EMULATOR_LOST_FILE" ]; }
          MERGED=0
          finish () {
            local rc=$?
            stop_logcat
            bash .github/bench-ci/emulator-diagnostics.sh stop
            if emu_lost; then
              if [ "$MERGED" != "1" ]; then
                echo "########## MERGE (partial: emulator lost) ##########"
                node .github/bench-ci/merge-blocks.js || echo "::warning::partial merge failed"
              fi
              echo "::error::emulator lost during the latency bench — completed blocks merged as PARTIAL, job fails"
              rc=1
            fi
            exit "$rc"
          }
          trap finish EXIT
          bash .github/bench-ci/emulator-diagnostics.sh start emulator-5554 'run-bench\.js'

          # Re-baseline (0.27): an OFF block takes its proprietary package dir + the
          # release it must be (args 2/3); its block JSON is then stamped with the
          # provenance (npm version + sha256 of each binary/APK) of the dirs the
          # block itself recorded. The helper APK is versionCode 1 in every release,
          # so the tool-server's install probe would keep whichever release's APK is
          # already on the emulator: when the OFF binary set changes (OFF-1 ->
          # OFF-legacy -> OFF-2) uninstall it so the block installs the APK from its
          # own bin/, the one the stamp hashes. Without OFF-legacy nothing changes.
          LAST_OFF_PKG=""
          run_block () {
            local b="$1" pkg="${2:-}" ver="${3:-}" rc=0
            if emu_lost; then
              echo "::warning::block $b skipped: emulator lost (no restart — results would not be comparable)"
              return 1
            fi
            echo "block $b" > "$BENCH_CONTEXT_FILE"
            echo "########## BLOCK $b ##########"
            # F12: BLOCKING per-block readiness gate (strict, 4th arg = 1). A screen
            # that never settles poisons the effect check, so a timeout FAILS the
            # block (a tap on an ANR dialog is not a landed tap) instead of `|| true`.
            bash .github/bench-ci/ready-gate.sh emulator-5554 3 60 1 | tee -a "$BENCH_OUT/bench-log-$b.txt"
            if [ -z "$pkg" ]; then
              BENCH_ONLY="$b" BENCH_N="$BENCH_N" node .github/bench-ci/run-bench.js \
                2>&1 | tee -a "$BENCH_OUT/bench-log-$b.txt"
              return
            fi
            if [ -n "$LAST_OFF_PKG" ] && [ "$LAST_OFF_PKG" != "$pkg" ]; then
              echo "OFF binary set changed ($LAST_OFF_PKG -> $pkg): uninstalling com.argent.androiddevtools so $b installs its own helper APK" \
                | tee -a "$BENCH_OUT/bench-log-$b.txt"
              adb -s emulator-5554 uninstall com.argent.androiddevtools 2>&1 | tee -a "$BENCH_OUT/bench-log-$b.txt" || true
            fi
            LAST_OFF_PKG="$pkg"
            ARGENT_SIMULATOR_SERVER_DIR="$pkg/bin" \
            ARGENT_NATIVE_DEVTOOLS_ANDROID_BIN_DIR="$pkg/bin" \
            ARGENT_NATIVE_DEVTOOLS_DIR="$pkg/dylibs" \
            BENCH_ONLY="$b" BENCH_N="$BENCH_N" node .github/bench-ci/run-bench.js \
              2>&1 | tee -a "$BENCH_OUT/bench-log-$b.txt" || rc=$?
            [ "$rc" = "0" ] || return "$rc"
            node .github/bench-ci/proprietary-provenance.js stamp "$BENCH_OUT/bench-block-$b.json" \
              --expect-version "$ver" 2>&1 | tee -a "$BENCH_OUT/bench-log-$b.txt"
          }
          # F13: the OFF proprietary baseline. If the binary is executable on this
          # runner (PROP_EXECUTABLE=1) a requested OFF block that FAILS is a real
          # missing-baseline failure and fails the run (no warn-and-continue). Only a
          # proprietary that cannot exec at all (PROP_EXECUTABLE=0 — the documented
          # Linux refusal) downgrades to ON-only, and that downgrade is stated here,
          # not a silent absent baseline. The ON blocks + merge still run first so the
          # diagnostics survive; the OFF failure is enforced at the end of the step.
          RUN_OFF=0
          if [ "${PROP_EXECUTABLE:-0}" = "1" ]; then
            RUN_OFF=1
          else
            echo "::warning::proprietary simulator-server not executable on this runner — OFF baseline skipped, scoring ON-only (documented downgrade)"
          fi
          OFF_FAILED=0
          if [ "$RUN_OFF" = "1" ] && echo "$BENCH_BLOCKS" | grep -q "OFF-1"; then
            if run_block "OFF-1" "$PROP_PKG" "$BENCH_PROPRIETARY_VERSION"; then :; else
              OFF_FAILED=1
              echo "::error::OFF-1 proprietary baseline FAILED though the binary is executable — a missing baseline fails the run (F13)"
            fi
            sleep 3
          fi
          # ON blocks — hard requirement (set -e fails the step on any ON failure).
          if echo "$BENCH_BLOCKS" | grep -q "ON-uiautomation"; then run_block "ON-uiautomation"; sleep 3; fi
          # Phase 3n.2: ON-scrcpy removed. ON-input-manager is self-orchestrated by
          # run-bench.js (STRATEGY_ARMS) on the first run_block invocation above, so it
          # needs no explicit run_block call here.
          # Re-baseline (0.27): OFF-legacy — the proprietary arm on the OLDER release's
          # binaries (legacy_proprietary_version), its own BENCH_ONLY invocation in this
          # same job + emulator, so one run yields a same-device legacy-vs-current
          # proprietary comparison. Skipped when the input is empty or that binary
          # cannot exec here; an executable legacy block that FAILS fails the run at
          # the end (like F13), without blocking OFF-2.
          LEGACY_FAILED=0
          if echo "$BENCH_BLOCKS" | grep -q "OFF-legacy"; then
            if [ -z "$BENCH_LEGACY_PROPRIETARY_VERSION" ]; then
              echo "::notice::OFF-legacy requested but legacy_proprietary_version is empty — skipped"
            elif [ "${PROP_LEGACY_EXECUTABLE:-0}" != "1" ]; then
              echo "::warning::legacy proprietary simulator-server ($BENCH_LEGACY_PROPRIETARY_VERSION) not executable on this runner — OFF-legacy skipped"
            elif run_block "OFF-legacy" "$PROP_PKG_LEGACY" "$BENCH_LEGACY_PROPRIETARY_VERSION"; then
              sleep 3
            else
              LEGACY_FAILED=1
              echo "::error::OFF-legacy ($BENCH_LEGACY_PROPRIETARY_VERSION) FAILED though its binary is executable"
            fi
          fi
          if [ "$RUN_OFF" = "1" ] && [ "$OFF_FAILED" = "0" ] && echo "$BENCH_BLOCKS" | grep -q "OFF-2"; then
            if run_block "OFF-2" "$PROP_PKG" "$BENCH_PROPRIETARY_VERSION"; then :; else
              OFF_FAILED=1
              echo "::error::OFF-2 proprietary drift arm FAILED though the binary is executable — a missing baseline fails the run (F13)"
            fi
            sleep 3
          fi
          echo "########## MERGE ##########"
          stop_logcat
          node .github/bench-ci/merge-blocks.js
          MERGED=1
          # F13 enforcement: fail the run if an executable proprietary baseline block
          # failed (diagnostics + merge above are preserved for the artifacts first).
          if [ "$OFF_FAILED" = "1" ]; then
            echo "::error::proprietary OFF baseline failed on an executable runner — failing the run (missing baseline, F13)"
            exit 1
          fi
          if [ "$LEGACY_FAILED" = "1" ]; then
            echo "::error::OFF-legacy failed on an executable runner — failing the run (missing legacy baseline)"
            exit 1
          fi

      # ---- (4) 3g stage-timing table is emitted inline by the bench (captured in
      #          bench-log-*.txt above). No separate step needed. ----

      # ---- scoreboard into the job summary ----
      - name: Scoreboard → job summary
        if: always()
        run: |
          export BENCH_OUT="$PWD/.bench-results"
          mkdir -p "$BENCH_OUT"
          if node .github/bench-ci/scoreboard.js > "$BENCH_OUT/scoreboard.md" 2>/tmp/scoreboard.err; then
            cat "$BENCH_OUT/scoreboard.md" >> "$GITHUB_STEP_SUMMARY"
            cat "$BENCH_OUT/scoreboard.md"   # also to the step log (artifact-independent)
          else
            echo "scoreboard generation failed" | tee -a "$GITHUB_STEP_SUMMARY"
            cat /tmp/scoreboard.err || true
          fi

      - name: Stop host sampler + emulator post-mortem
        # Always: kill the sampler/watchdog, then dmesg tail (OOM/kvm highlights),
        # adb devices, emulator pid liveness, emulator.log tail, crash db + crashpad
        # dumps (50 MB cap), logcat tail if adb still answers. Never fails.
        if: always()
        run: |
          bash .github/bench-ci/emulator-diagnostics.sh stop
          bash .github/bench-ci/emulator-diagnostics.sh postmortem emulator-5554 "$EMU_DIAG_DIR/postmortem"

      - name: Stage artifacts
        # upload-artifact@v4 drops relative globs when mixed with absolute (/tmp)
        # paths (they share no common root); stage everything under one dir first.
        if: always()
        run: |
          STAGE="$RUNNER_TEMP/bench-artifacts"
          mkdir -p "$STAGE/logs"
          cp -r .bench-results "$STAGE/" 2>/dev/null || true
          cp /tmp/emulator.log /tmp/avdmanager.log /tmp/prop-probe.txt "$STAGE/logs/" 2>/dev/null || true
          cp /tmp/prop-probe-*.txt "$STAGE/logs/" 2>/dev/null || true
          cp "$RUNNER_TEMP/device-test.log" "$STAGE/logs/" 2>/dev/null || true
          cp "$RUNNER_TEMP/logcat-device-test.txt" "$STAGE/logs/" 2>/dev/null || true
          cp "$RUNNER_TEMP/ready-gate-device-test.txt" "$STAGE/logs/" 2>/dev/null || true
          # Emulator diagnostics: host-sampler.log, postmortem/, emulator-lost.json, env.
          cp -r "$EMU_DIAG_DIR/." "$STAGE/logs/" 2>/dev/null || true
          echo "=== staged ==="; find "$STAGE" -type f | sed "s|$STAGE/||" | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-latency
          path: ${{ runner.temp }}/bench-artifacts
          # .bench-results is dot-prefixed; upload-artifact@v4 excludes hidden paths
          # by default, which dropped the latency bench JSON + scoreboard. Keep it.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      # ---- ENFORCE the device-test result LAST (after diagnostics uploaded) ----
      - name: Enforce device-test result
        if: always()
        # The device-test step is continue-on-error so the bench always runs, but a
        # device-test failure MUST still fail the job — checked here, after every
        # diagnostic artifact is uploaded, so nothing can look green with a red
        # device suite (the phase-3h enforcement requirement).
        run: |
          echo "device-test outcome: ${{ steps.devtest.outcome }}"
          if [ "${{ steps.devtest.outcome }}" = "failure" ]; then
            echo "::error::device tests failed — see bench-latency/logs/device-test.log"
            exit 1
          fi
          echo "device tests passed."

      - name: Enforce emulator liveness
        # Fail-closed: a lost emulator fails the job even if every step above
        # somehow reported success (artifacts are already uploaded).
        if: always()
        run: bash .github/bench-ci/emulator-diagnostics.sh enforce

  # ── Screen-graph matrix (optional, own emulator, runs in parallel) ─────────
  screen-graph:
    name: Screen-graph matrix (x86_64 KVM)
    if: ${{ github.event.inputs.suite == 'screen-graph' || github.event.inputs.suite == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_USER_HOME: /home/runner/.android
      QT_QPA_PLATFORM: offscreen
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      # Re-baseline (0.27): B1 (the proprietary config) runs this release's binaries.
      BENCH_PROPRIETARY_VERSION: ${{ github.event.inputs.proprietary_version || '0.27.0' }}
      # Emulator diagnostics + levers (emulator-diagnostics.sh). Defaults = today.
      EMU_DIAG_DIR: /tmp/emu-diag
      EMULATOR_BUILD: ${{ github.event.inputs.emulator_build }}
      EMULATOR_GPU: ${{ github.event.inputs.emulator_gpu || 'swiftshader_indirect' }}
      EMULATOR_MEMORY_MB: ${{ github.event.inputs.emulator_memory_mb || '4096' }}

    steps:
      # feat/screen-graph-d is merged into open/main, so the screen-graph bench
      # tree is this job's own checked-out ref — build it directly, same as the
      # latency job (no separate branch checkout).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install emulator native deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            weston xkb-data libxkbcommon0 seatd libgoogle-perftools4t64

      - name: Install Android SDK packages
        run: |
          set -e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "emulator" "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "system-images;android-34;google_apis;x86_64" >/dev/null
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Pin emulator build (optional) + record emulator environment
        # emulator_build empty = keep sdkmanager's "emulator" (no change). Set = install
        # that exact build from dl.google.com, fail early on a 404, write back the stock
        # package.xml at the zip's Pkg.Revision (else avdmanager refuses the AVD),
        # verify -version and `sdkmanager --list_installed`.
        # Then ci-emulator-env.json (emulator version/build, system-image revision, adb,
        # $ImageVersion, kernel, nproc, free -m): uploaded and embedded in the results.
        run: |
          set -e
          [[ "$EMULATOR_MEMORY_MB" =~ ^[0-9]+$ ]] || { echo "::error::emulator_memory_mb '$EMULATOR_MEMORY_MB' is not a number"; exit 1; }
          [[ "$EMULATOR_GPU" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::emulator_gpu '$EMULATOR_GPU' is not a -gpu mode"; exit 1; }
          bash .github/bench-ci/emulator-diagnostics.sh install-emulator "$EMULATOR_BUILD"
          bash .github/bench-ci/emulator-diagnostics.sh env "system-images;android-34;google_apis;x86_64" "$GITHUB_WORKSPACE/.bench-results/ci-emulator-env.json"

      - name: Create AVD
        run: |
          set -e
          mkdir -p "$HOME/.android"
          echo no | avdmanager -v create avd -n argent-test \
            -k "system-images;android-34;google_apis;x86_64" -d "pixel_6" 2>&1 | tee /tmp/avdmanager.log
          CFG=$HOME/.android/avd/argent-test.avd/config.ini
          sed -i "s/^hw.ramSize.*\$/hw.ramSize = $EMULATOR_MEMORY_MB/" "$CFG" || echo "hw.ramSize = $EMULATOR_MEMORY_MB" >> "$CFG"
          sed -i 's/^hw.cpu.ncore.*$/hw.cpu.ncore = 2/' "$CFG" || echo "hw.cpu.ncore = 2" >> "$CFG"

      - name: Boot emulator with gRPC + token
        run: |
          set -e
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          nohup $ANDROID_HOME/emulator/emulator @argent-test \
            -no-window -no-audio -no-boot-anim -no-snapshot -read-only \
            -gpu "$EMULATOR_GPU" -grpc 8554 -grpc-use-token -no-metrics \
            > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          adb start-server
          timeout 300 adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')" = "1" ] && break
            sleep 2
          done
          adb -s emulator-5554 shell settings put global window_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0 || true

      - name: Install deps + build (screen-graph tree)
        # `npm ci` (phase 3n.3, 3N2-H2): the lockfile was regenerated in the main checkout
        # after the 3n.2 merge, so it matches package.json again — restore the
        # lockfile-integrity check on this job too.
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --no-save
          npm run build
          npm run build:android-device-server
          ls -la packages/android-device-server/bin/

      - name: Fetch proprietary binaries (B1 config, @swmansion/argent@<proprietary_version>)
        # Re-baseline (0.27): the release comes from the dispatch input. Its
        # provenance (version from the tarball's package.json + sha256 of every
        # binary/APK B1 uses) is written OUTSIDE BENCH_OUT (the matrix step empties
        # that dir) and recorded by the harness in bench-sg-*.json + results-ci.md.
        run: |
          set -e
          if ! [[ "$BENCH_PROPRIETARY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::proprietary_version '$BENCH_PROPRIETARY_VERSION' is not a semver"; exit 1
          fi
          PKGTMP="$RUNNER_TEMP/argent-pkg"; mkdir -p "$PKGTMP"
          ( cd "$PKGTMP" && npm pack "@swmansion/argent@$BENCH_PROPRIETARY_VERSION" )
          TARBALL=$(ls "$PKGTMP"/*.tgz | head -n1)
          mkdir -p "$PKGTMP/extracted"; tar -xzf "$TARBALL" -C "$PKGTMP/extracted"
          echo "PROP_PKG=$PKGTMP/extracted/package" >> "$GITHUB_ENV"
          chmod +x "$PKGTMP/extracted/package/bin/linux/simulator-server" 2>/dev/null || true
          node .github/bench-ci/proprietary-provenance.js npm \
            --bin-dir "$PKGTMP/extracted/package/bin" \
            --expect-version "$BENCH_PROPRIETARY_VERSION" \
            --out "$RUNNER_TEMP/proprietary-provenance.json"
          echo "BENCH_PROPRIETARY_PROVENANCE=$RUNNER_TEMP/proprietary-provenance.json" >> "$GITHUB_ENV"

      - name: Pre-flight (needle gate + optional capture)
        env:
          BENCH_SERIAL: emulator-5554
          # capture mode dumps launch+destination per task to capture.json (under
          # OUT_DIR, staged by the artifact step) and does NOT gate; matrix mode
          # gates: a BAD/MISSING needle exits 1 and — with pipefail — stops the job.
          BENCH_CAPTURE: ${{ github.event.inputs.sg_mode == 'capture' && '1' || '' }}
          BENCH_OUT: ${{ github.workspace }}/.bench-results/screen-graph
          ARGENT_SIMULATOR_SERVER_DIR: ${{ env.PROP_PKG }}/bin
          ARGENT_NATIVE_DEVTOOLS_ANDROID_BIN_DIR: ${{ env.PROP_PKG }}/bin
          ARGENT_NATIVE_DEVTOOLS_DIR: ${{ env.PROP_PKG }}/dylibs
        # `set -o pipefail` so the script's non-zero exit is NOT masked by `tee`
        # (the C.2 bug: the gate exited 1 but tee's 0 rode over it and the matrix
        # ran anyway). `-e` then fails the step, and — no continue-on-error here —
        # the later matrix step in the same job never runs on a failed pre-flight.
        run: |
          set -euo pipefail
          node -e 'require("ts-node").register({transpileOnly:true,skipProject:true,compilerOptions:{module:"commonjs",target:"ES2022",moduleResolution:"node",esModuleInterop:true,resolveJsonModule:true,skipLibCheck:true,strict:false,ignoreDeprecations:"6.0"}}); require("./packages/tool-server/scripts/bench-preflight.ts");' \
            2>&1 | tee "$RUNNER_TEMP/sg-preflight.log"

      - name: Screen-graph matrix
        id: matrix
        if: ${{ github.event.inputs.sg_mode != 'capture' }}
        env:
          BENCH_SERIAL: emulator-5554
          # C.4 work item F: 5 reps for a tighter Wilson interval above the noise floor.
          BENCH_REPS: "5"
          ARGENT_SIMULATOR_SERVER_DIR: ${{ env.PROP_PKG }}/bin
          ARGENT_NATIVE_DEVTOOLS_ANDROID_BIN_DIR: ${{ env.PROP_PKG }}/bin
          ARGENT_NATIVE_DEVTOOLS_DIR: ${{ env.PROP_PKG }}/dylibs
          NODE_OPTIONS: "--max-old-space-size=3072"
          # The harness defaults its report path to a hardcoded local macOS path
          # whose parent dir does not exist on the runner; only OUT_DIR is mkdir'd.
          # Point BENCH_REPORT under OUT_DIR (created before the write, and staged
          # by the artifact step) so writeFileSync does not ENOENT at run end.
          # BENCH_OUT is set explicitly here (the script defaults to the same path, but
          # the run block's `rm -rf "$BENCH_OUT"` needs it defined under `set -u`).
          BENCH_OUT: ${{ github.workspace }}/.bench-results/screen-graph
          BENCH_REPORT: ${{ github.workspace }}/.bench-results/screen-graph/results-ci.md
          # Phase 3n.3 (3N2-H4): start from an empty output dir + empty persisted graph
          # store, and stamp the run id / job start time into the report, the store meta
          # and the invariants line so a foreign execution's artifact can never be
          # mistaken for this run's (34888577404 shipped a four-hours-earlier report).
          BENCH_FRESH_STORE: "1"
          BENCH_RUN_ID: ${{ github.run_id }}
          BENCH_JOB_STARTED: ${{ github.run_started_at }}
          # Emulator diagnostics: the harness embeds ci-emulator-env.json as `emulator`,
          # writes `config <id>` for the watchdog, and on the watchdog's SIGTERM writes a
          # partial JSON + report (interrupted/not-run configs INVALID) and exits 1.
          BENCH_EMULATOR_ENV: ${{ github.workspace }}/.bench-results/ci-emulator-env.json
          BENCH_CONTEXT_FILE: ${{ env.EMU_DIAG_DIR }}/context
          BENCH_EMULATOR_LOST_FILE: ${{ env.EMU_DIAG_DIR }}/emulator-lost.json
        run: |
          set -euo pipefail
          # Host sampler (heartbeat every 60 s in this log) + liveness watchdog.
          bash .github/bench-ci/emulator-diagnostics.sh start emulator-5554 'bench-screen-graph\.ts'
          trap 'bash .github/bench-ci/emulator-diagnostics.sh stop' EXIT
          # `github.run_started_at` is not a valid context for workflow_dispatch (it
          # resolved empty on run 34904658366), so fall back to the step's wall clock.
          export BENCH_JOB_STARTED="${BENCH_JOB_STARTED:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          rm -rf "$BENCH_OUT"; mkdir -p "$BENCH_OUT"
          # Stamp the log's FIRST line with the run id (tee, overwrite), then append the
          # node output (tee -a) so sg-matrix.log itself is attributable to this run.
          echo "[bench-sg] run_id=${{ github.run_id }} job_started=$BENCH_JOB_STARTED — fresh $BENCH_OUT" | tee "$RUNNER_TEMP/sg-matrix.log"
          node -e 'require("ts-node").register({transpileOnly:true,skipProject:true,compilerOptions:{module:"commonjs",target:"ES2022",moduleResolution:"node",esModuleInterop:true,resolveJsonModule:true,skipLibCheck:true,strict:false,ignoreDeprecations:"6.0"}}); require("./packages/tool-server/scripts/bench-screen-graph.ts");' \
            2>&1 | tee -a "$RUNNER_TEMP/sg-matrix.log"

      - name: Stop host sampler + emulator post-mortem
        # Always: kill the sampler/watchdog, then dmesg tail (OOM/kvm highlights),
        # adb devices, emulator pid liveness, emulator.log tail, crash db + crashpad
        # dumps (50 MB cap), logcat tail if adb still answers. Never fails.
        if: always()
        run: |
          bash .github/bench-ci/emulator-diagnostics.sh stop
          bash .github/bench-ci/emulator-diagnostics.sh postmortem emulator-5554 "$EMU_DIAG_DIR/postmortem"

      - name: Stage screen-graph artifacts
        if: always()
        run: |
          STAGE="$RUNNER_TEMP/sg-artifacts"
          # Phase 3n.3 (3N2-H4): stage from an EMPTY dir so nothing from a prior step/run
          # rides along into this run's uploaded artifact.
          rm -rf "$STAGE"; mkdir -p "$STAGE/logs"
          cp -r .bench-results "$STAGE/" 2>/dev/null || true
          cp "$RUNNER_TEMP/sg-preflight.log" "$RUNNER_TEMP/sg-matrix.log" /tmp/emulator.log "$STAGE/logs/" 2>/dev/null || true
          cp "$RUNNER_TEMP/proprietary-provenance.json" "$STAGE/" 2>/dev/null || true
          # Emulator diagnostics: host-sampler.log, postmortem/, emulator-lost.json, env.
          cp -r "$EMU_DIAG_DIR/." "$STAGE/logs/" 2>/dev/null || true
          # Phase D C-M3: stage the device-captured pre-flight fixture so it can be
          # committed to the bench tree (the two BLOCKER-1 tests skip until it is).
          cp packages/tool-server/test/fixtures/preflight-launch-screens.json "$STAGE/" 2>/dev/null || true
          find "$STAGE" -type f | sed "s|$STAGE/||" | sort

      - name: Upload screen-graph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-screen-graph
          path: ${{ runner.temp }}/sg-artifacts
          # .bench-results is a dot-prefixed dir; upload-artifact@v4 excludes hidden
          # paths by default, which silently dropped the bench JSON + report. Keep it.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      # ---- ENFORCE validity LAST (after the artifacts are uploaded) ----
      - name: Enforce screen-graph validity + emulator liveness
        # The harness exits non-zero when a config is INVALID (aborted / infra-excluded
        # / cut short / interrupted: results-ci.md "## Validity") or a store invariant
        # fails; a lost emulator fails the job on its own. Run 37215518035 went green
        # with O2..O5 at 0/3 — this step makes that a failure.
        if: always()
        run: |
          echo "matrix outcome: ${{ steps.matrix.outcome }}"
          rc=0
          bash .github/bench-ci/emulator-diagnostics.sh enforce || rc=1
          if [ "${{ steps.matrix.outcome }}" = "failure" ]; then
            echo "::error::screen-graph matrix failed (validity gate, store invariants or harness error) — see results-ci.md ## Validity"
            rc=1
          fi
          exit "$rc"
