name: bench-androidworld

# AW-1: AndroidWorld harness end to end with a FIXED agent (one model, one
# prompt), the OPEN android-device-server as the only driver, and the observation
# TIER (`compact` / `full`) as the only variable. Two jobs:
#
#   probe   — Step 0 pre-flight (no model key): boot API 33 WITHOUT -grpc-use-token,
#             start our instrumentation, then read AndroidWorld's a11y forest and
#             `uiautomator dump` WHILE our server holds UiAutomation, and record
#             whether the forest is empty (the a11y-suppression blocker, research
#             §2). Decides whether DeviceControlInstrumentation needs
#             FLAG_DONT_SUPPRESS_ACCESSIBILITY_SERVICES.
#   harness — Step 3 one run: 5 tasks x 2 tiers x 1 model (claude-opus-5) on the
#             open driver, per-episode JSON. Needs the ANTHROPIC_API_KEY repo
#             secret; without it the job fails fast with the exact name.
#
# The emulator recipe (KVM + SDK + AVD + boot) is lifted from
# bench-open-vs-proprietary.yml with three edits the research (§3) requires:
# image android-33 (AW is developed on Pixel 6 / API 33), boot WITHOUT the gRPC
# token (no proprietary arm here; AndroidWorld connects to -grpc 8554 plain), and
# a --perform_emulator_setup step that installs AW's own 24 APKs before the run.
# x86_64 / KVM here is NOT comparable to local arm64 / HVF; this run is "the
# harness runs and the tiers differ by X tokens/step at equal success", nothing
# stronger.

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: false
        default: "probe"
        type: choice
        options:
          - probe
          - harness
      tasks:
        description: "Comma list of AndroidWorld task names (harness)"
        required: false
        default: "ContactsAddContact,ClockStopWatchRunning,MarkorCreateFolder,MarkorDeleteNote,SimpleCalendarDeleteOneEvent"
      tiers:
        description: "Comma list of describe tiers (harness)"
        required: false
        default: "compact,full"
      seed:
        description: "task_random_seed (harness; pinned per run)"
        required: false
        default: "30"

jobs:
  # ── Step 0: a11y-suppression probe (no model key) ─────────────────────────
  probe:
    name: AW a11y-suppression probe (API 33, x86_64 KVM)
    if: ${{ github.event.inputs.job == 'probe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_USER_HOME: /home/runner/.android
      QT_QPA_PLATFORM: offscreen
      XDG_RUNTIME_DIR: /tmp/xdg-runtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable KVM (nested virt on ubuntu-latest)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install emulator native deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            weston xkb-data libxkbcommon0 seatd libgoogle-perftools4t64

      - name: Install Android SDK packages (API 33)
        run: |
          set -e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "emulator" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "system-images;android-33;google_apis;x86_64" >/dev/null
          SYSIMG="$ANDROID_HOME/system-images/android-33/google_apis/x86_64"
          test -f "$SYSIMG/system.img" || test -f "$SYSIMG/userdata.img" || {
            echo "::error::system image not installed under $SYSIMG"
            ls -la "$ANDROID_HOME/system-images/android-33" 2>&1 || true
            exit 1
          }
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Create AVD (Pixel 6, API 33, 4 GB / 2 vCPUs)
        run: |
          set -e
          mkdir -p "$HOME/.android"
          echo no | avdmanager -v create avd \
            -n androidworld-test \
            -k "system-images;android-33;google_apis;x86_64" \
            -d "pixel_6" 2>&1 | tee /tmp/avdmanager.log
          AVD_RC=${PIPESTATUS[1]}
          CFG=$HOME/.android/avd/androidworld-test.avd/config.ini
          if [ "$AVD_RC" -ne 0 ] || [ ! -f "$CFG" ]; then
            echo "::error::avdmanager exit=$AVD_RC, config.ini=$([ -f "$CFG" ] && echo present || echo missing)"
            cat /tmp/avdmanager.log
            exit 1
          fi
          sed -i 's/^hw.ramSize.*$/hw.ramSize = 4096/' "$CFG" || echo "hw.ramSize = 4096" >> "$CFG"
          sed -i 's/^hw.cpu.ncore.*$/hw.cpu.ncore = 2/' "$CFG" || echo "hw.cpu.ncore = 2" >> "$CFG"
          grep -E "^(hw\.ramSize|hw\.cpu\.ncore|hw\.gpu)" "$CFG"

      - name: Boot emulator with gRPC (NO token — AW connects plain -grpc 8554)
        run: |
          set -e
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          nohup $ANDROID_HOME/emulator/emulator @androidworld-test \
            -no-window -no-audio -no-boot-anim -no-snapshot -read-only \
            -gpu swiftshader_indirect -grpc 8554 \
            -no-metrics -camera-back none -camera-front none \
            > /tmp/emulator.log 2>&1 &
          echo "emulator pid=$!"
          adb start-server
          timeout 300 adb wait-for-device
          for i in $(seq 1 180); do
            BC=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')
            if [ "$BC" = "1" ]; then echo "boot_completed at t+${i}s"; break; fi
            sleep 2
          done
          [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '[:space:]')" = "1" ] || {
            echo "::error::emulator did not finish booting"; tail -100 /tmp/emulator.log; exit 1; }
          adb -s emulator-5554 shell input keyevent 82 || true
          adb -s emulator-5554 shell settings put global window_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0 || true
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP || true
          adb -s emulator-5554 shell wm dismiss-keyguard || true
          sleep 20
          adb devices -l

      - name: Install argent deps + build TS
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --no-save
          npx tsc --build

      - name: Build open device-server APK (Kotlin, Java 17)
        run: |
          npm run build:android-device-server
          ls -la packages/android-device-server/bin/

      - name: Kotlin unit tests (JUnit — incl. UiAutomationFlagsTest)
        # assembleDebug above proves the refactored Kotlin compiles; this compiles
        # + runs the JVM unit tests (UiAutomationFlags arg parsing, EmulatorDetect,
        # inject strategies, serializers). local.properties was written by build.sh.
        run: |
          cd packages/android-device-server
          ./gradlew --no-daemon testDebugUnitTest

      - name: Install AndroidWorld (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r bench/androidworld/requirements.txt

      - name: Probe — opt-in gating both ways (default suppresses, arg restores)
        id: probe
        env:
          OPEN_SERVER_SERIAL: emulator-5554
          AW_GRPC_PORT: "8554"
          AW_CONSOLE_PORT: "5554"
          PROBE_OUT: ${{ github.workspace }}/.bench-results/androidworld/probe.json
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$PROBE_OUT")"
          python bench/androidworld/probe_a11y.py \
            --serial emulator-5554 \
            --grpc-port 8554 \
            --console-port 5554 \
            --apk "$(ls packages/android-device-server/bin/argent-device-control-*.apk | head -n1)" \
            --out "$PROBE_OUT" \
            2>&1 | tee "$RUNNER_TEMP/probe.log"

      - name: Stage probe artifacts
        if: always()
        run: |
          STAGE="$RUNNER_TEMP/probe-artifacts"
          rm -rf "$STAGE"; mkdir -p "$STAGE/logs"
          cp -r .bench-results "$STAGE/" 2>/dev/null || true
          cp "$RUNNER_TEMP/probe.log" /tmp/emulator.log "$STAGE/logs/" 2>/dev/null || true
          find "$STAGE" -type f | sed "s|$STAGE/||" | sort

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-androidworld-probe
          path: ${{ runner.temp }}/probe-artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # ── Step 3: harness run (needs ANTHROPIC_API_KEY) ─────────────────────────
  harness:
    name: AW harness (5 tasks x 2 tiers x claude-opus-5, API 33)
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'harness'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_USER_HOME: /home/runner/.android
      QT_QPA_PLATFORM: offscreen
      XDG_RUNTIME_DIR: /tmp/xdg-runtime

    steps:
      - name: Fail fast if the model key is missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY repo secret is not set — the harness cannot run. Add the secret named exactly ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions), then re-dispatch with job=harness."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install emulator native deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            weston xkb-data libxkbcommon0 seatd libgoogle-perftools4t64

      - name: Install Android SDK packages (API 33)
        run: |
          set -e
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "emulator" "platform-tools" "platforms;android-33" "build-tools;34.0.0" \
            "system-images;android-33;google_apis;x86_64" >/dev/null
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Create AVD (Pixel 6, API 33)
        run: |
          set -e
          mkdir -p "$HOME/.android"
          echo no | avdmanager -v create avd -n androidworld-test \
            -k "system-images;android-33;google_apis;x86_64" -d "pixel_6" 2>&1 | tee /tmp/avdmanager.log
          CFG=$HOME/.android/avd/androidworld-test.avd/config.ini
          sed -i 's/^hw.ramSize.*$/hw.ramSize = 4096/' "$CFG" || echo "hw.ramSize = 4096" >> "$CFG"
          sed -i 's/^hw.cpu.ncore.*$/hw.cpu.ncore = 2/' "$CFG" || echo "hw.cpu.ncore = 2" >> "$CFG"

      - name: Boot emulator with gRPC (NO token)
        run: |
          set -e
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          nohup $ANDROID_HOME/emulator/emulator @androidworld-test \
            -no-window -no-audio -no-boot-anim -no-snapshot -read-only \
            -gpu swiftshader_indirect -grpc 8554 -no-metrics \
            > /tmp/emulator.log 2>&1 &
          adb start-server
          timeout 300 adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '[:space:]')" = "1" ] && break
            sleep 2
          done
          adb -s emulator-5554 shell settings put global window_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global transition_animation_scale 0 || true
          adb -s emulator-5554 shell settings put global animator_duration_scale 0 || true
          sleep 20

      - name: Install argent deps + build TS
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --no-save
          npx tsc --build

      - name: Build open device-server APK
        run: |
          npm run build:android-device-server
          ls -la packages/android-device-server/bin/

      - name: Install AndroidWorld (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r bench/androidworld/requirements.txt

      # AW's --perform_emulator_setup downloads app data over the network and
      # installs its 24 APKs — a flaky external dependency inside the job (research
      # risk 4). Cache the downloaded app-data dir so a re-run skips the download.
      - name: Cache AndroidWorld app data
        uses: actions/cache@v4
        with:
          path: /home/runner/.android_world
          key: androidworld-appdata-${{ hashFiles('bench/androidworld/requirements.txt') }}

      - name: AndroidWorld emulator setup (install the 24 task APKs)
        env:
          AW_CONSOLE_PORT: "5554"
          AW_GRPC_PORT: "8554"
        run: |
          set -uo pipefail
          python bench/androidworld/run_aw.py setup \
            --serial emulator-5554 --console-port 5554 --grpc-port 8554 \
            2>&1 | tee "$RUNNER_TEMP/aw-setup.log"

      - name: Harness — 5 tasks x 2 tiers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPEN_SERVER_SERIAL: emulator-5554
          AW_CONSOLE_PORT: "5554"
          AW_GRPC_PORT: "8554"
          NODE_OPTIONS: "--max-old-space-size=3072"
          AW_OUT: ${{ github.workspace }}/.bench-results/androidworld
        run: |
          set -uo pipefail
          mkdir -p "$AW_OUT"
          python bench/androidworld/run_aw.py run \
            --serial emulator-5554 --console-port 5554 --grpc-port 8554 \
            --tasks "${{ github.event.inputs.tasks }}" \
            --tiers "${{ github.event.inputs.tiers }}" \
            --task-random-seed "${{ github.event.inputs.seed }}" \
            --n-task-combinations 1 \
            --model claude-opus-5 \
            --checkpoint-dir "$AW_OUT/checkpoint" \
            --out-dir "$AW_OUT" \
            --run-id "${{ github.run_id }}" \
            2>&1 | tee "$RUNNER_TEMP/aw-harness.log"

      - name: Stage harness artifacts
        if: always()
        run: |
          STAGE="$RUNNER_TEMP/aw-artifacts"
          rm -rf "$STAGE"; mkdir -p "$STAGE/logs"
          cp -r .bench-results "$STAGE/" 2>/dev/null || true
          cp "$RUNNER_TEMP/aw-setup.log" "$RUNNER_TEMP/aw-harness.log" /tmp/emulator.log "$STAGE/logs/" 2>/dev/null || true
          find "$STAGE" -type f | sed "s|$STAGE/||" | sort

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-androidworld-harness
          path: ${{ runner.temp }}/aw-artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
