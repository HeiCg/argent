steps:
  # ── Start from the home screen ────────────────────────────────────────
  # `home` is device-scoped (no app session needed). The first press leaves
  # whatever app is up; the second normalizes to the first home page (a
  # press while already home always returns there, including from the App
  # Library, where the swipe below would open the wrong search).
  - tool: button
    args:
      button: home
  # SpringBoard is never launched; this registers it as the automation
  # target so the home-page swipe runs in its coordinate space.
  - tool: launch-app
    args:
      bundleId: com.apple.springboard
  - tool: button
    args:
      button: home
  # ── Open Reminders through Spotlight search ───────────────────────────
  # Swipe down on the home page opens Spotlight — a SEPARATE process, so the
  # session switches to com.apple.Spotlight before reading or typing.
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.3
      toX: 0.5
      toY: 0.62
      durationMs: 300
  - tool: launch-app
    args:
      bundleId: com.apple.Spotlight
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: SpotlightSearchField
      timeoutMs: 8000
  - tool: keyboard
    args:
      text: Reminders
  # The Top Hit cell keeps this stable identifier whatever its label shows.
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: "Identifier:GridCell,Section:0,Row:0"
      timeoutMs: 8000
  - tap:
      identifier: "Identifier:GridCell,Section:0,Row:0"
  # Re-register the in-app automation session (the search tap opened the app;
  # this launch is an idempotent foreground + session switch).
  - tool: launch-app
    args:
      bundleId: com.apple.reminders
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: New Reminder
      timeoutMs: 10000
  # ── Create the reminder ───────────────────────────────────────────────
  - tap:
      text: New Reminder
  - tool: keyboard
    args:
      text: Cook something 25 August at 14:35
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Suggested Time
      timeoutMs: 10000
  # The chip label embeds the parsed date (relative to the run day), so the
  # selector deliberately matches only its stable prefix.
  - tap:
      text: Suggested Time
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Edit Details
      timeoutMs: 8000
  - tap:
      text: Edit Details
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Priority
      timeoutMs: 8000
  - tap:
      text: Priority
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: High
      timeoutMs: 8000
  - tap:
      text: High
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Priority
      timeoutMs: 8000
  - tap:
      text: Done
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: New Reminder
      timeoutMs: 8000
  # ── Verify the reminder was created correctly ─────────────────────────
  # Three independent checks against the committed row: title, time (the
  # row's date text always carries "14:35" whatever day the flow runs), and
  # the high-priority marker in the cell's accessibility label.
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Cook something
      timeoutMs: 8000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: "14:35"
      timeoutMs: 8000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: High priority
      timeoutMs: 8000
  # ── Clean up after ourselves: delete via selection mode ───────────────
  # Deliberately NOT the long-press context menu: its preview blur never
  # reports idle to XCTest, stalling every gesture near it for ~60s. The
  # More → Select Reminders path is plain pulldown/toolbar taps and runs in
  # seconds. Selection mode exits by itself once the reminder is deleted.
  - tap:
      identifier: OverflowBarButtonItem
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Select Reminders
      timeoutMs: 8000
  - tap:
      text: Select Reminders
  # "Done" only exists in the nav bar while selection mode is active.
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Done
      timeoutMs: 8000
  - tap:
      text: Cook something
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: 1 Selected
      timeoutMs: 8000
  - tap:
      text: Delete
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Delete Reminder
      timeoutMs: 8000
  - tap:
      text: Delete Reminder
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: Cook something
      timeoutMs: 10000
  # ── Back to the home screen ───────────────────────────────────────────
  - tool: button
    args:
      button: home
executionPrerequisite: Physical iPhone unlocked; Reminders' notification
  permission already granted; Reminders' last-open screen was a reminders
  list (search-opening restores the app where it was left)
